<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <!-- Cloudflare Worker stamps the per-request CSP nonce onto this tag's `nonce`
         attribute at the edge. main.tsx reads it and calls setNonce() so that
         react-style-singleton (used by Radix Dialog, Dropdown, Popover, etc.)
         automatically carries the nonce on every <style> it injects at runtime. -->
    <meta property="csp-nonce" />
    <!-- Cloudflare Worker stamps the user's ISO country code (e.g. "US") here at the
         edge. Client code reads this via getCountryCode() in lib/geo.ts so no external
         IP-geolocation API call is needed in production. -->
    <meta name="cf-country" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <!-- Generated from the canonical Webflow page during predev/prebuild. -->
    <link rel="stylesheet" href="/assets/pexly-webflow-fonts.css" />
    <link rel="stylesheet" href="/assets/pexly-webflow-header.css" />
    <link rel="stylesheet" href="/assets/pexly-webflow-brand.css" />
    <!-- Sets theme class before first paint so ThemeProvider has nothing to change,
         eliminating the full-document style recalculation on initial load.
         Inlined to avoid a blocking network round-trip for a 180-byte file. -->
    <script>try{var t=localStorage.getItem('pexly-theme');document.documentElement.classList.add(t==='dark'?'dark':'light');}catch(e){document.documentElement.classList.add('light');}</script>
    <script src="/static-route-redirect.js"></script>
    <title>Pexly — Your wallet, your way to pay</title>
    <meta name="description" content="Pexly is a non-custodial crypto marketplace for people who use their own wallets to pay for digital services." />

    <!-- Supabase preconnect hints are injected here at build time by vite.config.ts
         when VITE_SUPABASE_URL is defined. No placeholder needed in source HTML. -->
    <!--SUPABASE_PRECONNECT-->
   <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Open Graph / Social Media -->
    <meta property="og:title" content="Pexly — Your wallet, your way to pay" />
    <meta property="og:description" content="A non-custodial crypto marketplace for digital services. Pay with your own wallet." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.pexly.app/" />
    <meta property="og:image" content="https://www.pexly.app/hero-bg.webp" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Pexly — digital services with your own wallet" />
    <meta property="og:site_name" content="Pexly" />
    <!-- Twitter / WhatsApp card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pexly — Your wallet, your way to pay" />
    <meta name="twitter:description" content="A non-custodial crypto marketplace for digital services. Pay with your own wallet." />
    <meta name="twitter:image" content="https://www.pexly.app/hero-bg.webp" />
    <meta name="twitter:image:alt" content="Pexly — digital services with your own wallet" />

    <!-- Global JSON-LD Schema -->

        {
          "@type": "Organization",
          "@id": "https://www.pexly.app/#organization",
          "name": "Pexly",
          "alternateName": "Pexly",
          "url": "https://www.pexly.app/",
          "description": "Pexly is a non-custodial crypto marketplace for people who use their own wallets to pay for digital services.",
          "foundingDate": "2024",
          "logo": {
            "@type": "ImageObject",
            "url": "https://www.pexly.app/favicon.svg",
            "width": "512",
            "height": "512"
          },
          "contactPoint": [
            {
              "@type": "ContactPoint",
              "contactType": "technical support",
              "availableLanguage": ["English"],
              "areaServed": "Worldwide"
            }
          ],
          "sameAs": [],
          "knowsAbout": ["Non-custodial wallets", "Digital services", "Cryptocurrency payments"],
          "slogan": "Your wallet, your way to pay"
        },
        {
          "@type": "WebSite",
          "@id": "https://www.pexly.app/#website",
          "url": "https://www.pexly.app/",
          "name": "Pexly",
          "description": "A non-custodial crypto marketplace for digital services, mobile top ups, and utility payments.",
          "publisher": {
            "@id": "https://www.pexly.app/#organization"
          },
          "inLanguage": "en-US"
        },
        {
          "@type": "SoftwareApplication",
          "@id": "https://www.pexly.app/#software",
          "name": "Pexly Decentralized Software",

          "provider": {

          },
          "applicationCategory": "BusinessApplication",

          "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "USD"
          }
        }
      ]

    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
